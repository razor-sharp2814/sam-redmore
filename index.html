<!-- Jost (a Futura-style face) for the release caption, subset to just the letters it uses -->

<style>
/* Background artwork is 1920×976, sized with `cover` from the top centre.
   Its scale factor is max(100vw/1920, 100vh/976). The original page (via
   <br> spacers + vertical centring) put the middle of the cover image at
   y≈460 of that artwork, so we anchor to that point directly:
   460/1920 = 23.96vw, 460/976 = 47.13vh. */
:root {
  /* The release block (cover + caption) is 331×411 at full size and scales
     down with the screen on narrow phones; --u is one "original pixel". */
  --cover-w: min(331px, calc(100vw - 32px));
  --u: calc(var(--cover-w) / 331);
  --cover-h: calc(var(--u) * 411);
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: #fff;
  color: #fff;
  font: 16px/1.5 Arial, sans-serif;
  text-align: center;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(rgba(0, 0, 0, .4), rgba(0, 0, 0, .4)),
    #174883 url(assets/img/bg.webp) center top / cover no-repeat;
}
main {
  min-height: 100vh;
  min-height: 100dvh;
  box-sizing: border-box;
  padding: max(16px, calc(max(23.96vw, 47.13vh) - var(--cover-h) / 2)) 0 24px;
}
a { color: #fff; text-decoration: none; }
a:focus-visible { outline: 1px dotted #fff; outline-offset: 3px; }

/* Release: cover + caption, laid out to match the old 331×411 image */
.release {
  display: block;
  width: var(--cover-w);
  height: var(--cover-h);
  margin: 0 auto calc(.7em + .7vw);
}
.release img {
  display: block;
  width: 100%;
  height: auto;
}
.release-title,
.release-cta {
  display: block;
  /* The artwork's caption is Futura squeezed to 80% width: widen the box
     by 1/0.8 so the text stays centred, then squeeze it back */
  width: 125%;
  margin-left: -12.5%;
  transform: scaleX(.8);
  font-family: Jost, Futura, "Trebuchet MS", Arial, sans-serif;
  line-height: 1;
  text-transform: uppercase;
  white-space: nowrap;
}
.release-title {
  margin-top: calc(var(--u) * 3);
  font-size: calc(var(--u) * 28.8);
  font-weight: 700;
}
.release-title .dot {
  display: inline-block;
  width: .24em;
  height: .24em;
  margin: 0 .02em;
  border-radius: 50%;
  background: currentColor;
  vertical-align: .25em;
}
.release-cta {
  margin-top: calc(var(--u) * -19);
  color: #ffdd00;
  font-size: calc(var(--u) * 17.1);
  font-weight: 700;
  transition: color .3s;
}
.release:hover .release-cta,
.release:focus-visible .release-cta { color: #fff; }

/* Social links */
.social {
  display: flow-root;
  margin: 0 auto;
  padding: 0 15px;
}
.social ul {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: .7em;
}
.social li { display: inline; }
.social a {
  position: relative;
  display: inline-block;
  margin: 1%;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 0 1px rgba(255, 255, 255, .3);
  transition: color .3s;
}
.social a::before {
  content: "•";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  color: transparent;
  text-shadow: 0 0 transparent;
  transition: text-shadow .3s, color .3s;
  pointer-events: none;
}
.social a:hover,
.social a:focus-visible { text-shadow: none; }
.social a:hover::before,
.social a:focus-visible::before {
  color: #fff;
  text-shadow: 10px 0 #fff, -10px 0 #fff;
}

/* Contact */
.contact {
  margin: calc(1.5em / .7) 0 0; /* one line of body text */
  font-size: .7em;
  text-transform: uppercase;
}
.contact a:hover,
.contact a:focus-visible { color: #666; }

@media (min-width: 1200px) {
  .social { width: 60%; box-sizing: border-box; }
}
@media (max-width: 1600px) { body { font-size: 12.5px; } }
@media (max-width: 800px) {
  .social ul:first-child { margin-top: 4%; }
  .contact { padding-top: 4vw; }
}
@media (max-width: 384px) {
  body { font-size: 11px; }
  .release { margin-bottom: calc(.49em + .7vw); }
}
@media (prefers-reduced-motion: reduce) {
  .social a, .social a::before, .release-cta { transition: none; }
}
</style>
